name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: threadline
          POSTGRES_PASSWORD: threadline_ci
          POSTGRES_DB: threadline_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threadline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://threadline:threadline_ci@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://threadline:threadline_ci@localhost:5432/threadline_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (PostgreSQL 16)
        run: npm test
      - name: Tests (embedded database)
        run: npm run test:pglite
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end (production build)
        run: npm run test:e2e -- --trace off
